name: CI

on:
  push:
  pull_request:

# CPU only, always. Full training runs are launched manually on the GPU box and never
# from CI — the free-GPU budget is the project's scarcest resource (CON-4).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: make setup

      - name: Check (lint, format, tests)
        run: make check

      - name: Smoke — all three chapters
        run: make smoke
