name: CI

on:
  push:
  pull_request:

# CPU only, always. Full training runs are launched manually on the GPU box and never
# from CI — the free-GPU budget is the project's scarcest resource (CON-4).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run black --check .

      - name: Tests
        run: uv run pytest -q

      - name: Smoke — ch1
        run: uv run python -m ch1_architecture.train --config ch1_architecture/configs/smoke.yaml

      - name: Smoke — ch2
        run: uv run python -m ch2_adaptation.finetune --config ch2_adaptation/configs/smoke.yaml

      - name: Smoke — ch3
        run: uv run python -m ch3_operation.serve --config ch3_operation/configs/smoke.yaml
