name: Docker

# Kept out of the main `check` job (ci.yml): a multi-minute multi-stage image build should
# not tax every commit. Runs on changes under docker/ and on demand (spec O4 T4).
on:
  push:
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "eval/**"
      - "monitoring/**"
      - "ch3_operation/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 is not optional (AC-8): HF Spaces will not start an arm64-only image, and
      # this is the platform check that catches an accidental Apple-Silicon-only build
      # before it ever reaches a deploy.
      - name: Build (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: reviewer:ci
