# The published generation run: ~300 (buggy Java/Spring snippet -> ReviewOutput label) pairs,
# generated by injecting a bug into curator-collected clean snippets with Gemini
# (the same frontier model C1 benchmarks -- distillation, not "beats a bigger model").
# The GPU-budget hook blocks this file from being run inside a session
# (`--config .../full.yaml` matches its full-run pattern) -- correct, since this makes ~300
# real API calls. Run it by hand: GEMINI_API_KEY=... PRICE_PER_1K_INPUT_USD=...
# PRICE_PER_1K_OUTPUT_USD=... uv run python -m ch2_adaptation.data_gen
# --config ch2_adaptation/configs/datagen_full.yaml
#
# frontier_model_tag switched from gemini-2.5-flash to gemini-3.5-flash-lite -- the
# 2.5-flash free tier on this key turned out to be 20 requests/day, nowhere near enough
# for ~300 generation calls, and gemini-2.5-flash-lite (the first replacement tried) is
# retired for this key. See baseline_full.yaml's comment and progress_report.md (Action
# Plan item 4) for the full diagnosis.
frontier_provider: gemini
frontier_model_tag: gemini-3.5-flash-lite
temperature: 0.7
max_new_tokens: 512
seed_pool_path: ch2_adaptation/data/seed_snippets/clean_pool.jsonl
train_path: ch2_adaptation/data/train.jsonl
val_path: ch2_adaptation/data/val.jsonl
provenance_path: ch2_adaptation/data/provenance.json
val_frac: 0.10
n_snippets: 150
variants_per_snippet: 2
max_budget_usd: 1.50
seed: 42
wandb_mode: online
wandb_project: ch2-adaptation
