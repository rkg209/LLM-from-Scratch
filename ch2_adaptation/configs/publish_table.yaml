# without re-running any model. Reads nothing but these two JSON files, so it needs no GPU
# and no EVAL_CONTEXT=1 -- it never touches the holdout.
#   uv run python -m ch2_adaptation.publish_table --config ch2_adaptation/configs/publish_table.yaml
