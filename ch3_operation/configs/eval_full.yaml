# Production evaluate profile: score the real quantized GGUF against the frozen holdout,
# with EVAL_CONTEXT=1 set (the leakage guard enforces this) and compared to the adapter's
# published rate. Run manually, after O1's export pipeline has produced outputs/model.gguf.
model_path: ${MODEL_PATH}
n_ctx: 4096
n_threads: 4
max_tokens: 512
temperature: 0.0
holdout_path: eval/holdout/holdout.jsonl
results_path: eval/results/gguf.json
compare_to: eval/results/finetuned.json
n_samples: 9999
seed: 0
