# Production serving profile — the quantized GGUF model, CPU-only (CON-12).
# model_path is resolved from the MODEL_PATH env var at startup; the .gguf is pulled from
# HF Hub by the container, never committed to git.
model_path: ${MODEL_PATH}
n_ctx: 4096
n_threads: 4
max_tokens: 512
temperature: 0.2
host: 0.0.0.0
port: 8000
metrics_window: 100
