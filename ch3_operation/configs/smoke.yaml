model_path: ch3_operation/tests/fixtures/tiny.gguf
n_ctx: 1536
n_threads: 2
max_tokens: 128
temperature: 0.0
host: 127.0.0.1
port: 8000
metrics_window: 100
max_request_bytes: 32768
api_version: "v1"
